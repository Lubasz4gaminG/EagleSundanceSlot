<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Top 3 Payout Rankings</title>
  <style>
    @font-face{font-family:"Press Start 2P";src:url("assets/PressStart2P-vaV7.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
    :root{color-scheme:dark;font-family:Arial,sans-serif;color:#eaf8ff;background:#081c2a}
    *{box-sizing:border-box}body{margin:0}main{position:relative;min-height:350px;height:100vh;background:url("assets/canadian_back.png") center/cover no-repeat}
    .details{position:absolute;top:13.5%;left:50%;transform:translateX(-50%);width:min(400px,calc(100% - 32px))}
    .game-header{margin:0 0 7px;color:#eaf8ff;font-size:12px;line-height:1.3;text-align:center}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{margin:0;color:#e4cf80;font-size:18px;letter-spacing:2px}
    .subtitle{margin:4px 0 0;color:#b8cbd6;font-size:12px}button{background:transparent;color:#c5e9f4;border:1px solid #527286;border-radius:5px;padding:5px 9px;cursor:pointer}
    ol{list-style:none;margin:7px 0;padding:0;font-family:Consolas,monospace;font-weight:bold;font-variant-numeric:tabular-nums}
    li{display:grid;grid-template-columns:22px 1fr auto;gap:12px;padding:2px 0;border-bottom:1px solid #294656;font-size:20px}
    li span:first-child{color:#8ca9bb}li span:nth-child(2){letter-spacing:4px}li span:last-child{color:#e4cf80}li span:nth-child(2),li span:last-child{font-family:"Press Start 2P",monospace;font-weight:400;font-size:clamp(11px,2.5vw,14px);white-space:nowrap}
    #status{min-height:1.4em;margin:0 0 7px;color:#b8cbd6;font-size:11px}a{display:inline-block;color:white;background:#20546b;border:1px solid #83c9dd;border-radius:6px;padding:7px 12px;text-decoration:none;font-weight:bold;font-size:13px}
    a:hover{background:#2c6a85}a:focus-visible,button:focus-visible{outline:2px solid white;outline-offset:3px}button:disabled{opacity:.5;cursor:default}
    @media(max-width:360px){h1{font-size:16px}li{gap:8px;font-size:19px}}
  </style>
</head>
<body>
<main aria-labelledby="title">
  <div class="details">
  <p class="game-header">Eagle Sundance Slot Game - Canadian Wolf</p>
  <header><h1 id="title">Top 3 Payout Rankings</h1><button id="refresh" type="button">Refresh</button></header>
  <ol id="scores" aria-label="Highest payouts"></ol>
  <p id="status" role="status" aria-live="polite">Loading shared scores…</p>
  <a href="https://lubasz4gaming.github.io/EagleSundanceSlot/" target="_blank" rel="noopener noreferrer">Play Canadian Wolf ↗</a>
  </div>
</main>
<script>
  "use strict";
  const list=document.getElementById("scores"),status=document.getElementById("status"),refresh=document.getElementById("refresh");
  function render(scores){
    list.replaceChildren();
    for(let i=0;i<3;i++){
      const entry=scores[i],row=document.createElement("li");
      const amount=entry ? (entry.cents/100).toLocaleString("en-US",{style:"currency",currency:"USD"}) : "—";
      for(const text of [String(i+1),entry ? entry.initials : "— — —",amount]){
        const span=document.createElement("span");span.textContent=text;row.append(span);
      }
      list.append(row);
    }
  }
  async function load(){
    refresh.disabled=true;status.textContent="Loading shared scores…";
    try{
      const response=await fetch("https://siberian-wolf-leaderboard.lubaszj.workers.dev/v1/scores",{cache:"no-store",signal:AbortSignal.timeout(5000)});
      if(!response.ok)throw new Error("Unavailable");
      const data=await response.json();
      if(!Array.isArray(data.scores)||data.scores.length>3||data.scores.some(entry=>
        !entry||typeof entry.initials!=="string"||!/^[A-Z0-9]{3}$/.test(entry.initials)||!Number.isSafeInteger(entry.cents)||entry.cents<=0))throw new Error("Invalid scores");
      render(data.scores);status.textContent=data.scores.length ? "Single-spin payouts include bonus winnings." : "No payouts recorded yet. Be the first!";
    }catch{status.textContent="Scores unavailable. Select Refresh to try again.";}
    finally{refresh.disabled=false;}
  }
  refresh.addEventListener("click",load);render([]);load();
</script>
</body>
</html>
